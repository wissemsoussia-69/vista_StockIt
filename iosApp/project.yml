# StockIT iOS — définition du projet Xcode (générer avec : cd iosApp && xcodegen)
name: StockIT
options:
  bundleIdPrefix: com.ETX
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: fr
  # Langues disponibles (sélecteur dans Paramètres) : fr, en
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: Q9MJ6WBCL3
packages:
  Auth0:
    url: https://github.com/auth0/Auth0.swift
    from: 2.25.0
targets:
  StockIT:
    type: application
    platform: iOS
    sources:
      - path: StockIT
    dependencies:
      - package: Auth0
      - target: StockITWidget
        embed: true
      - sdk: Vision.framework
      - sdk: AVFoundation.framework
      - sdk: PDFKit.framework
    preBuildScripts:
      - name: "Compile Kotlin (shared)"
        basedOnDependencyAnalysis: false
        script: |
          if [ "YES" = "$OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED" ]; then
            echo "Skipping Gradle build task invocation due to OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED"
            exit 0
          fi
          cd "$SRCROOT/.."
          # Xcode n'hérite pas du PATH du shell : on cherche un JDK 17+ (Homebrew ou système)
          if [ -z "$JAVA_HOME" ]; then
            for j in /opt/homebrew/opt/openjdk@21/libexec/openjdk.jdk/Contents/Home \
                     /opt/homebrew/opt/openjdk@17/libexec/openjdk.jdk/Contents/Home \
                     "/Applications/Android Studio.app/Contents/jbr/Contents/Home"; do
              if [ -x "$j/bin/java" ]; then export JAVA_HOME="$j"; break; fi
            done
            [ -z "$JAVA_HOME" ] && export JAVA_HOME="$(/usr/libexec/java_home 2>/dev/null)"
          fi
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ETX.stockit
        PRODUCT_NAME: StockIT
        INFOPLIST_FILE: StockIT/Support/Info.plist
        CODE_SIGN_ENTITLEMENTS: StockIT/Support/StockIT.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: "$(inherited) -framework Shared -lsqlite3"
  StockITWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: StockITWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ETX.stockit.widget
        INFOPLIST_FILE: StockITWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: StockITWidget/StockITWidget.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
  StockITUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: StockITUITests
    dependencies:
      - target: StockIT
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ETX.stockit.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  StockIT:
    build:
      targets:
        StockIT: all
        StockITUITests: [test]
    test:
      targets:
        - StockITUITests
    run:
      config: Debug
